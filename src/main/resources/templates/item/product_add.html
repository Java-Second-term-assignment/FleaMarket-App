<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>出品確認</title>
	<link rel="stylesheet" th:href="@{/css/variables.css}">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
	<script th:src="@{/js/theme.js}"></script>
	<!-- 画面専用CSS -->
	<link rel="stylesheet" th:href="@{/css/product_confirm.css}">
</head>

<body>

	<!-- ヘッダー -->
	<div th:replace="~{ui/fragments :: header}"></div>

	<!-- ================= メイン ================= -->
	<main class="main-container">
		<h1 class="page-title">出品内容の確認</h1>

		<form th:action="@{/product/submit}" method="post" enctype="multipart/form-data" class="confirm-card"
			th:object="${productForm}">
			<th:block th:replace="~{ui/fragments :: csrf_token}"></th:block>
			<input type="hidden" name="shippingFeePayer" value="SELLER">

			<p th:if="${errorMessage}" th:text="${errorMessage}" class="required error-text"></p>
			<p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="required error-text"></p>
			<p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="required error-text"></p>
			<p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="required error-text"></p>

			<!-- ================= 商品情報 ================= -->
			<div class="confirm-section">
				<div class="input-hint">商品情報</div>

				<div class="confirm-row">
					<label for="name">商品名<span class="required">（必須）</span></label>
					<div class="confirm-value">
						<input id="name" type="text" th:field="*{name}" class="input50" placeholder="タイトルを入力してください"
							required maxlength="200" style="width:100%;">
						<div class="input-hint">200字以内</div>
					</div>
				</div>

				<!-- ================= 商品画像 ================= -->
				<div class="form-section file-area">
			        <label for="images">商品画像<span class="required">（必須）</span></label>
			        <div class="confirm-row">
			            <span class="input-hint">画像（1枚以上10枚まで）</span>
			            <div class="confirm-value">
			                <input id="images" type="file" name="images"
			                    accept="image/jpeg,image/png,image/gif,image/webp" multiple required
			                    onchange="
			                            let files = this.files;
			                            let fileNamesSpan = document.getElementById('selected-image-names');
			                            if (files.length === 0) {
			                                fileNamesSpan.textContent = '選択なし';
			                            } else if (files.length > 10) {
			                                fileNamesSpan.textContent = '10枚まで選択可能です（現在' + files.length + '枚）';
			                                this.value = '';
			                                alert('画像は最大10枚まで選択できます。');
			                            } else {
			                                fileNamesSpan.textContent = files.length + 'ファイル選択済み';
			                            }
			                        ">
			                <button type="button" class="custom-file-btn"
			                    onclick="document.getElementById('images').click();">画像を選択</button>
			                <span id="selected-image-names">選択なし</span>
			                <p class="input-hint">JPEG、PNG、GIF、WebP形式。最大5MB/枚。1枚以上10枚まで選択できます。</p>
			            </div>
			        </div>
			    </div>

				<div class="category-select-section form-section">
			        <h2>商品の詳細</h2>
			        <div class="input-hint">
			          カテゴリー<span class="required">（必須）</span>
			        </div>
			        <div class="custom-category-select-wrapper">
			          <select id="categoryId" name="categoryId" required onchange="
			            // '選択してください'のoption(値が空)を他の選択時にはdisabledに
			            var select = this;
			            var firstOption = select.options[0];
			            if(select.selectedIndex > 0) {
			                firstOption.disabled = true;
			            } else {
			                firstOption.disabled = false;
			            }
			          ">
			            <option value="">選択してください</option>
			            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
			          </select>
			          <span class="material-symbols-outlined">expand_more</span>
			        </div>
			    </div>

			    <div class="form-section condition-select-section">
			      <div class="input-hint">
			        商品状態<span class="required">（必須）</span>
			      </div>
			      <div class="condition-select-row">
			        <label class="condition-radio-label">
			          <input type="radio" name="condition" value="NEW" required>
			          <span>新品</span>
			        </label>
			        <label class="condition-radio-label">
			          <input type="radio" name="condition" value="LIKE_NEW">
			          <span>未使用に近い</span>
			        </label>
			        <label class="condition-radio-label">
			          <input type="radio" name="condition" value="USED_GOOD">
			          <span>目立った傷や汚れなし</span>
			        </label>
			        <label class="condition-radio-label">
			          <input type="radio" name="condition" value="USED_FAIR">
			          <span>やや傷や汚れあり</span>
			        </label>
			        <label class="condition-radio-label">
			          <input type="radio" name="condition" value="USED_POOR">
			          <span>傷や汚れあり</span>
			        </label>
			      </div>
			    </div>

				<div class="confirm-row">
					<div class="input-hint" style="margin-bottom: 2px;">
						商品説明<span class="required">（必須）</span>
					</div>
					<div class="confirm-value">
						<textarea th:field="*{description}" placeholder="商品の説明を入力" maxlength="5000" class="input50"
							style="width:100%;min-height:100px;"></textarea>
					</div>
				</div>
			</div>

			<!-- ================= 価格 ================= -->
			<div class="form-section price-section">
				<div class="price-section-header">
					価格を設定する
				</div>

				<div class="price-section-body">
					<div class="price-row">
						<span class="price-label">販売価格</span>
						<span class="price-range">¥300〜</span>
					</div>

					<div class="price-input-area">
						<input class="input50 price-input" type="text" inputmode="numeric" pattern="\d*"
							placeholder="例）3000" th:field="*{price}" required>

						<div class="input-hint price-input-hint">
							半角数字で入力してください（例：3000）
						</div>
					</div>

					<hr class="price-section-divider">

					<div class="price-fee">
						<span>販売手数料</span>
						<span th:if="${fee != null}" th:text="'¥' + ${#numbers.formatInteger(fee, 3, 'COMMA')} + '（' + ${commissionRatePercent} + '%）'">-</span>
						<span th:if="${fee == null}" th:text="'手数料率 ' + ${commissionRatePercent} + '%（出品時に価格に応じて計算）'">-</span>
					</div>

					<div class="price-profit">
						<span>販売利益</span>
						<span th:text="${profit != null ? '¥' + profit : '-'}">-</span>
					</div>

					<div class="price-bottom-space"></div>
				</div>
			</div>

			<!-- ================= ボタン ================= -->
			<div class="confirm-button-area">
				<button type="submit" class="form-submit-btn">
					この内容で出品
				</button>
			</div>

			<p class="input-hint">
				※ 出品後は内容を変更できません。
			</p>
		</form>
	</main>


</body>

</html>
