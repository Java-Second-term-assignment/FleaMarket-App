<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{ui/fragments :: common_head(${product.name + ' | 商品詳細'}, ~{::link})}">
	<link rel="stylesheet" th:href="@{/css/product.css}">
	<link rel="stylesheet" th:href="@{/css/detail.css}">
</head>

<body>
	<div th:replace="~{ui/fragments :: header}"></div>

	<main class="main-container">
		<div class="detail-card">
			<div class="detail-card-scroll">
				<div class="detail-layout">

					<!-- ================= 左：画像 ================= -->
				<aside class="image-aside">
					<div class="sticky-wrapper">
						<div class="main-image-container">
							<img id="target-main-image" class="main-image" th:src="${product.mainImageUrl}" alt="商品画像" onerror="this.src='/img/no-image.png'">
						</div>

						<ul class="thumbnail-list">
							<li th:each="img, stat : ${product.images}" class="thumbnail-item"
								th:classappend="${stat.first} ? 'active'"
								th:onclick="|changeImage('${img.largeUrl}', this)|">
								<img th:src="${img.thumbnailUrl}" alt="サムネイル">
							</li>
						</ul>
					</div>
				</aside>

				<!-- ================= 右：商品情報 ================= -->
				<section class="info-main">

					<h1 class="product-title" th:text="${product.name}">商品名</h1>

					<div class="price-header-row">
						<span class="current-label">価格:</span>
						<div class="price-row" th:text="'¥ ' + ${#numbers.formatInteger(product.price,3,'COMMA')}">
							¥0
						</div>
						<span>(税込・送料込み)</span>
					</div>

					<div class="product-info-row">
						<div class="category-tag" th:text="${product.category.name}">
							カテゴリー
						</div>
						<div class="stock-info">
							在庫:
							<span th:text="${product.stock}">0</span>
						</div>
					</div>

					<div class="action-row">
						<button class="icon-btn" title="お気に入り">
							<span class="material-symbols-outlined">
							favorite
							</span>
						</button>
						<button class="icon-btn" title="通報">
							<span class="material-symbols-outlined">
							error
							</span>
						</button>
					</div>

					<a th:href="@{/order/confirm(productId=${product.id})}" class="btn-purchase" th:classappend="${product.stock == 0} ? 'disabled'">購入に進む</a>

					<div class="long-text">
						<p th:text="${product.description}">商品説明</p>
					</div>

					<!-- ================= カート ================= -->
					<div class="button-group">
						<form th:action="@{/cart/add}" method="post" style="flex:2;">
							<input type="hidden" name="productId" th:value="${product.id}">
							<button type="submit" class="btn-blue" th:disabled="${product.stock == 0}">
								カートに入れる
							</button>
						</form>
						<button class="btn-gray">お気に入り</button>
					</div>

					<!-- ================= レビュー ================= -->
					<section class="review-section">
						<h3 class="review-title">カスタマーレビュー</h3>

						<!-- レビュー要約 -->
						<div class="rating-summary">
							<span class="rating-score" th:text="${reviewSummary.average}">
								0
							</span>
							<span class="stars" th:text="${reviewSummary.stars}">
								★★★★☆
							</span>
							<span class="review-count" th:text="'(' + ${reviewSummary.count} + '件)'">
								(0件)
							</span>
						</div>

						<!-- レビュー一覧 -->
						<div class="review-list">
							<div class="review-item" th:each="review : ${reviews}">
								<div class="review-header">
									<span th:text="${review.userName}">ユーザー名</span>
									<span th:text="${#temporals.format(review.createdAt,'yyyy/MM/dd')}">
										日付
									</span>
								</div>
								<div class="review-stars" th:text="${review.stars}">
									★★★★★
								</div>
								<p class="review-text" th:text="${review.comment}">
									コメント
								</p>
							</div>
						</div>

						<!-- ================= レビュー投稿 ================= -->

						<!-- 未ログイン -->
						<p sec:authorize="isAnonymous()" class="review-login-message">
							レビューを投稿するには
							<a th:href="@{/login}">ログイン</a>
							してください。
						</p>

						<!-- ログイン時 -->
						<form sec:authorize="isAuthenticated()" class="review-form"
							th:action="@{/product/{id}/review(id=${product.id})}" method="post"
							th:object="${reviewForm}">


							<div class="review-form-group">
								<label class="review-form-label">
									レビュー
									<span class="review-required">(必須)</span>
								</label>

								<textarea id="review-text" class="review-form-textarea" th:field="*{comment}"
									maxlength="500" required placeholder="レビューを書く"></textarea>

								<div id="review-charcount" class="review-charcount">
									0/500
								</div>

								<p th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}" class="error-text">
								</p>
							</div>

							<div class="review-form-group mb20">
								<label class="review-form-label">
									評価
									<span class="review-required">(必須)</span>
								</label>

								<div class="review-rating-row">
									<span id="single-star" class="star">★</span>
									<select id="review-rating" class="review-form-select" th:field="*{rating}" required>
										<option value="" disabled>選択</option>
										<option th:each="r : ${ratings}" th:value="${r}" th:text="${r}">
										</option>
									</select>
								</div>

								<p th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}" class="error-text"></p>
							</div>

							<button type="submit" class="review-form-submit">
								投稿する
							</button>
						</form>
					</section>
				</section>
				</div>
			</div>
		</div>

		<!-- ================= 関連商品 ================= -->
		<section class="related-section" th:if="${relatedProducts != null and !relatedProducts.isEmpty()}">
			<h2 class="section-title">関連商品</h2>
			<div class="product-grid">
				<a th:each="product : ${relatedProducts}" th:with="productId=${product.id != null ? product.id.toString() : ''}" th:href="@{/products/{id}(id=${productId})}">
					<div class="item-card">
						<div class="item-card-image">
							<img th:src="${product.imageUrl}" class="item-img" onerror="this.src='/img/no-image.png'">
							<div class="soldout-badge" th:if="${product.soldOut}">
								<span>Sold out</span>
							</div>
						</div>
						<div class="item-card-content">
							<div class="item-card-title" th:text="${product.name}"></div>
							<div class="item-card-price">
								値段:
								<span class="price-value" th:text="|${product.price}円|"></span>
							</div>
							<div class="item-card-footer">
								ジャンル:
								<span class="item-card-category-chip" th:text="${product.category}"></span>
							</div>
						</div>
					</div>
				</a>
			</div>
		</section>
	</main>

	<script th:src="@{/js/script.js}"></script>
</body>

</html>
