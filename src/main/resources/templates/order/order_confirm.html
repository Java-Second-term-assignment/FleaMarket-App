<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{ui/fragments :: common_head('注文確認', ~{::link})}">
	<link rel="stylesheet" th:href="@{/css/order_confirm.css}">
</head>

<body>
	<!-- 共通ヘッダー -->
	<div th:replace="~{ui/fragments :: header}"></div>
	<th:block th:if="${clientSecret != null and !#strings.isEmpty(clientSecret)}">
		<script src="https://js.stripe.com/v3/"></script>
	</th:block>

	<main class="confirm-container">

		<!-- 左：注文詳細 -->
		<section class="confirm-main">
			<h1 class="page-title">注文確認</h1>

			<div th:if="${errorMessage}" class="flash-error" th:text="${errorMessage}" role="alert"></div>

			<!-- 商品 -->
			<div class="section-card">
				<div class="section-title">注文商品</div>

				<div class="item-row" th:each="item : ${order.items}">
					<img th:src="${item.imageUrl}" class="item-img">
					<div class="item-details">
						<h4 th:text="${item.name}">商品名</h4>
						<div class="item-price" th:text="'¥ ' + ${#numbers.formatInteger(item.price,3,'COMMA')}">
							¥ 0
						</div>
						<div class="item-qty">
							数量: <span th:text="${item.quantity}">1</span>
						</div>
					</div>
				</div>
			</div>

			<!-- 支払い -->
			<div class="section-card">
				<div class="section-title">
					お支払い方法
					<a th:href="${productId != null} ? @{/payment(productId=${productId})} : @{/payment}" class="edit-link">変更</a>
				</div>

				<div class="info-grid">
					<div class="info-label">カード</div>
					<div class="info-value" th:text="${payment.method}">クレジットカード</div>

					<div class="info-label">支払い回数</div>
					<div class="info-value" th:text="${payment.installment}">一括払い</div>
				</div>
			</div>

			<!-- 配送先 -->
			<div class="section-card">
				<div class="section-title">
					お届け先
					<a th:href="${productId != null} ? @{/address(productId=${productId})} : @{/address}" class="edit-link">変更</a>
				</div>

				<div class="info-grid">
					<div class="info-label">氏名</div>
					<div class="info-value" th:text="${address.name}">山田 太郎</div>

					<div class="info-label">郵便番号</div>
					<div class="info-value" th:text="${address.postcode}">〒000-0000</div>

					<div class="info-label">住所</div>
					<div class="info-value" th:text="${address.fullAddress}">
						東京都〇〇区
					</div>
				</div>
			</div>
		</section>

		<!-- 右：注文サマリー -->
		<aside class="confirm-sidebar">
			<div class="summary-card">
				<h3>注文合計</h3>

				<div class="summary-row">
					<span>商品合計</span>
					<span th:text="'¥ ' + ${order.subtotal}">¥ 0</span>
				</div>

				<div class="summary-row">
					<span>配送料</span>
					<span th:text="'¥ ' + ${order.shippingFee}">¥ 0</span>
				</div>

				<div class="summary-row">
					<span>手数料（出品者負担）</span>
					<span th:text="'¥ ' + ${#numbers.formatInteger(order.commissionFee != null ? order.commissionFee : 0, 3, 'COMMA')}">¥ 0</span>
				</div>

				<div class="total-row">
					<span>請求金額</span>
					<span th:text="'¥ ' + ${order.total}">¥ 0</span>
				</div>

				<!-- Stripe 決済（clientSecret があるときのみ表示） -->
				<th:block th:if="${clientSecret != null and !#strings.isEmpty(clientSecret)}">
					<h4 style="margin-top: 1.5rem; margin-bottom: 0.5rem;">決済確認</h4>
					<p class="section-desc">以下の内容で決済を完了します。</p>
					<div id="payment-error" class="flash-error" role="alert" style="display:none;"></div>
					<form id="payment-form">
						<div id="payment-element-wrapper" style="min-height: 280px;">
							<p id="payment-element-loading" style="margin: 1rem 0; color: #666;">カード情報を読み込み中…</p>
							<div id="payment-element"></div>
						</div>
						<div class="form-actions" style="margin-top: 1rem;">
							<button type="submit" id="submit-payment-button" class="btn-submit">決済を完了する</button>
						</div>
					</form>
				</th:block>

				<!-- 注文を確定する（Stripe 無効または clientSecret がないとき） -->
				<th:block th:if="${clientSecret == null or #strings.isEmpty(clientSecret)}">
					<form th:action="@{/order/confirm}" method="post">
						<th:block th:replace="~{ui/fragments :: csrf_token}"></th:block>
						<input type="hidden" name="productId" th:value="${productId}" th:if="${productId != null}">
						<button class="btn-submit" type="submit">
							注文を確定する
						</button>
					</form>
				</th:block>

				<p class="info-text">
					注文確定後のキャンセルはできません。
				</p>
			</div>
		</aside>

	</main>

	<script th:src="@{/js/order_confirm.js}"></script>
	<script th:if="${clientSecret != null and !#strings.isEmpty(clientSecret)}" th:inline="javascript">
	(function() {
		var publishableKey = /*[[${publishableKey}]]*/ '';
		var clientSecret = /*[[${clientSecret}]]*/ '';
		var paymentIntentId = /*[[${paymentIntentId}]]*/ '';
		var returnUrl = window.location.origin + '/order/complete-purchase?payment_intent_id=' + encodeURIComponent(paymentIntentId);

		var errorDiv = document.getElementById('payment-error');
		var loadingEl = document.getElementById('payment-element-loading');

		if (!publishableKey || !clientSecret || !paymentIntentId) {
			if (errorDiv) {
				errorDiv.textContent = '決済情報の読み込みに失敗しました。';
				errorDiv.style.display = 'block';
			}
			if (loadingEl) loadingEl.style.display = 'none';
			return;
		}

		var stripe = Stripe(publishableKey);
		var elements = stripe.elements({
			clientSecret: clientSecret,
			appearance: { theme: 'stripe', variables: { borderRadius: '6px' } }
		});
		var paymentElement = elements.create('payment');
		paymentElement.on('ready', function() {
			if (loadingEl) loadingEl.style.display = 'none';
		});
		paymentElement.on('loaderror', function() {
			if (loadingEl) loadingEl.textContent = 'カード欄の読み込みに失敗しました。';
			if (errorDiv) {
				errorDiv.textContent = 'Stripe の読み込みに失敗しました。ページを再読み込みしてください。';
				errorDiv.style.display = 'block';
			}
		});
		paymentElement.mount('#payment-element');

		var form = document.getElementById('payment-form');
		var submitBtn = document.getElementById('submit-payment-button');
		if (form && submitBtn) {
			form.addEventListener('submit', function(ev) {
				ev.preventDefault();
				submitBtn.disabled = true;
				if (errorDiv) { errorDiv.style.display = 'none'; errorDiv.textContent = ''; }
				stripe.confirmPayment({
					elements: elements,
					confirmParams: { return_url: returnUrl },
					redirect: 'if_required'
				}).then(function(result) {
					if (result.error) {
						if (errorDiv) {
							errorDiv.textContent = (result.error.type === 'card_error' || result.error.type === 'validation_error')
								? (result.error.message || '支払いに失敗しました。')
								: '予期せぬエラーが発生しました。';
							errorDiv.style.display = 'block';
						}
						submitBtn.disabled = false;
					} else {
						window.location.href = returnUrl;
					}
				});
			});
		}
	})();
	</script>
</body>

</html>
