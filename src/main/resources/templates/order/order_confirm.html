<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{ui/fragments :: common_head('注文確認', ~{::link})}">
	<link rel="stylesheet" th:href="@{/css/order_confirm.css}">
</head>

<body>
	<!-- 共通ヘッダー -->
	<div th:replace="~{ui/fragments :: header}"></div>

	<main class="confirm-container">

		<!-- 左：注文詳細 -->
		<section class="confirm-main">
			<h1 class="page-title">注文確認</h1>

			<!-- 商品 -->
			<div class="section-card">
				<div class="section-title">注文商品</div>

				<div class="item-row" th:each="item : ${order.items}">
					<img th:src="${item.imageUrl}" class="item-img">
					<div class="item-details">
						<h4 th:text="${item.name}">商品名</h4>
						<div class="item-price" th:text="'¥ ' + ${#numbers.formatInteger(item.price,3,'COMMA')}">
							¥ 0
						</div>
						<div class="item-qty">
							数量: <span th:text="${item.quantity}">1</span>
						</div>
					</div>
				</div>
			</div>

			<!-- 支払い -->
			<div class="section-card">
				<div class="section-title">
					お支払い方法
					<a th:href="${productId != null} ? @{/payment(productId=${productId})} : @{/payment}" class="edit-link">変更</a>
				</div>

				<div class="info-grid">
					<div class="info-label">カード</div>
					<div class="info-value" th:text="${payment.method}">クレジットカード</div>

					<div class="info-label">支払い回数</div>
					<div class="info-value" th:text="${payment.installment}">一括払い</div>
				</div>
			</div>

			<!-- 配送先 -->
			<div class="section-card">
				<div class="section-title">
					お届け先
					<a th:href="${productId != null} ? @{/address(productId=${productId})} : @{/address}" class="edit-link">変更</a>
				</div>

				<div class="info-grid">
					<div class="info-label">氏名</div>
					<div class="info-value" th:text="${address.name}">山田 太郎</div>

					<div class="info-label">郵便番号</div>
					<div class="info-value" th:text="${address.postcode}">〒000-0000</div>

					<div class="info-label">住所</div>
					<div class="info-value" th:text="${address.fullAddress}">
						東京都〇〇区
					</div>
				</div>
			</div>
		</section>

		<!-- 右：注文サマリー -->
		<aside class="confirm-sidebar">
			<div class="summary-card">
				<h3>注文合計</h3>

				<div class="summary-row">
					<span>商品合計</span>
					<span th:text="'¥ ' + ${order.subtotal}">¥ 0</span>
				</div>

				<div class="summary-row">
					<span>配送料</span>
					<span th:text="'¥ ' + ${order.shippingFee}">¥ 0</span>
				</div>

				<div class="summary-row">
					<span>手数料</span>
					<span>¥ 0</span>
				</div>

				<div class="total-row">
					<span>請求金額</span>
					<span th:text="'¥ ' + ${order.total}">¥ 0</span>
				</div>

				<form th:action="@{/order/confirm}" method="post">
					<button class="btn-submit" type="submit">
						注文を確定する
					</button>
				</form>

				<p class="info-text">
					注文確定後のキャンセルはできません。
				</p>
			</div>
		</aside>

	</main>

	<script th:src="@{/js/order_confirm.js}"></script>
</body>

</html>
