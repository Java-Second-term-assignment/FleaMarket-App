<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>パスワード変更</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" th:href="@{/css/variables.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
	<script th:src="@{/js/theme.js}"></script>
	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
	<!-- 共通ヘッダー（商品一覧などと同じ） -->
	<div th:replace="~{ui/fragments :: header}"></div>
	<div class="container">
		<div class="auth-card-header">
			<h1>パスワードを変更</h1>
		</div>

		<div class="content">
			<p th:if="${successMessage}" class="success-text" style="color: green; margin-bottom: 1em;" th:text="${successMessage}"></p>
			<p th:if="${errorMessage}" class="error-text" style="color: #c00; margin-bottom: 1em;" th:text="${errorMessage}"></p>

			<form th:action="@{/password-change}" method="post">
				<th:block th:replace="~{ui/fragments :: csrf_token}"></th:block>

				<div class="form-group">
					<label>新しいパスワード<span class="required">（必須）</span></label>
					<input type="password" name="password" placeholder="10文字以上、英数字・記号を含む" required autocomplete="new-password">
				</div>

				<div class="form-group">
					<label>パスワード確認<span class="required">（必須）</span></label>
					<input type="password" name="confirmPassword" placeholder="再度入力してください" required autocomplete="new-password">
				</div>

				<button type="submit" class="btn btn-login">
					パスワードを変更する
				</button>
			</form>

			<div class="link-bottom">
				<a th:href="@{/user/settings}">ユーザー設定に戻る</a>
			</div>
		</div>
	</div>

	<div class="copyright">© My Shop</div>

</body>
</html>
