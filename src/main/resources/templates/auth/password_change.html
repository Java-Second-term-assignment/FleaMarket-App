<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>パスワード再設定</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" th:href="@{/css/variables.css}">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
	<script th:src="@{/js/theme.js}"></script>
	<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>
	<div class="theme-toggle-fixed" th:replace="~{ui/fragments :: theme_toggle_button}"></div>
	<div class="container">
		<div class="header">
			<h1>Reset Password</h1>
		</div>

		<div class="content">
			<form th:action="@{/password-change}" method="post">

				<div class="form-group">
					<label>
						新しいパスワード<span class="required">（必須）</span>
					</label>
					<input type="password" name="password" placeholder="8文字以上で入力してください" required>
				</div>

				<div class="form-group">
					<label>
						パスワード確認<span class="required">（必須）</span>
					</label>
					<input type="password" name="confirmPassword" placeholder="再度入力してください" required>
				</div>

				<button type="submit" class="btn btn-change">
					パスワードを変更する
				</button>
			</form>

			<div class="link-bottom">
				<a th:href="@{/login}">ログイン画面に戻る</a>
			</div>
		</div>
	</div>

	<div class="copyright">© My Shop</div>

</body>

</html>
