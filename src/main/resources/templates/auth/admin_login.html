<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>管理者ログイン</title>
	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

	<div class="container">
		<div class="header">
			<h1>管理者ログイン</h1>
		</div>

		<div class="content">
			<p th:if="${param.error != null}" class="error-text" style="margin-bottom: 1em;">
				<span th:if="${param.error[0] == 'forbidden'}">管理者権限がありません。一般ユーザーは <a th:href="@{/login}">通常のログイン</a> をご利用ください。</span>
				<span th:unless="${param.error[0] == 'forbidden'}">メールアドレスまたはパスワードが正しくありません。</span>
			</p>

			<form th:action="@{/admin/login}" method="post">
				<div class="form-group">
					<label>
						メールアドレス<span class="required">（必須）</span>
					</label>
					<input type="email" name="email" required autocomplete="username">
				</div>

				<div class="form-group">
					<label>
						パスワード<span class="required">（必須）</span>
					</label>
					<input type="password" name="password" required autocomplete="current-password">
				</div>

				<button type="submit" class="btn btn-login">
					管理者としてログイン
				</button>
			</form>
		</div>
	</div>

	<div class="copyright">©.</div>

</body>

</html>
