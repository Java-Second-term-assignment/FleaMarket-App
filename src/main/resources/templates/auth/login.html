<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Login</title>

	<link rel="stylesheet" th:href="@{/css/variables.css}">
	<!-- ログイン専用CSS -->
	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

	<div class="container">
		<div class="header">
			<h1>Login</h1>
		</div>

		<div class="content">
			<div class="link-top-right">
				<a th:href="@{/register}">会員登録はこちら</a>
			</div>

			<p th:if="${successMessage}" th:text="${successMessage}" style="color: green; margin-bottom: 1em;"></p>

			<!-- ログインフォーム -->
			<form th:action="@{/login}" method="post">
				<div class="form-group">
					<label>
						メールアドレス<span class="required">（必須）</span>
					</label>
					<input type="email" name="email" required>
				</div>

				<div class="form-group">
					<label>
						パスワード<span class="required">（必須）</span>
					</label>
					<input type="password" name="password" required>
				</div>

				<button type="submit" class="btn btn-login">
					ログイン
				</button>
			</form>

			<div class="link-bottom">
				パスワードがわからない場合は
				<a th:href="@{/password/forgot}">こちら</a>
			</div>
		</div>
	</div>

	<div class="copyright">©.</div>

</body>

</html>
