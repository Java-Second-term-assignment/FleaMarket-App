<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ログイン</title>

	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" th:href="@{/css/variables.css}">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
	<script th:src="@{/js/theme.js}"></script>
	<!-- ログイン専用CSS -->
	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
	<div class="theme-toggle-fixed" th:replace="~{ui/fragments :: theme_toggle_button}"></div>
	<div class="auth-actions">
		<div class="link-back" th:if="${returnUrl != null}">
			<a th:href="${returnUrl}">← 戻る</a>
		</div>
		<div class="link-back" th:if="${returnUrl == null}">
			<a th:href="@{/products}">← 商品一覧へ</a>
		</div>
	</div>
	<div class="container">
		<div class="header">
			<h1>ログイン</h1>
		</div>

		<div class="content">
			<div class="link-top-right">
				<a th:href="@{/register}">会員登録はこちら</a>
			</div>

			<p th:if="${successMessage}" th:text="${successMessage}" style="color: green; margin-bottom: 1em;"></p>

			<!-- ログインフォーム -->
			<form th:action="@{/login}" method="post">
				<input type="hidden" name="returnUrl" th:value="${returnUrl != null} ? ${returnUrl} : ''">
				<div class="form-group">
					<label>メールアドレス</label>
					<input type="email" name="email" required>
				</div>

				<div class="form-group">
					<label>パスワード</label>
					<input type="password" name="password" required>
				</div>

				<button type="submit" class="btn btn-login">
					ログイン
				</button>
			</form>

			<div class="link-bottom">
				パスワードがわからない場合は
				<a th:href="@{/password/forgot}">こちら</a>
			</div>
		</div>
	</div>

	<div class="copyright">©.</div>

</body>

</html>
