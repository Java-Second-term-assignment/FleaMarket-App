<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>ログイン</title>

	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" th:href="@{/css/variables.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
	<script th:src="@{/js/theme.js}"></script>
	<link rel="stylesheet" th:href="@{/css/auth.css}">
	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
	<!-- 共通ヘッダー（商品一覧などと同じ） -->
	<div class="header">
		<div class="header-inner">
			<div class="logo">
				<a th:href="@{/}" style="color:white; text-decoration:none;">LOGO</a>
			</div>
			<nav class="nav">
				<div class="nav-links">
					<div class="nav-item nav-item-theme">
						<th:block th:replace="~{ui/fragments :: theme_toggle_button}"></th:block>
					</div>
					<div class="nav-item">
						<a th:href="@{/products}">商品一覧</a>
					</div>
					<div class="nav-item">
						<a th:href="@{/board}">掲示板一覧</a>
					</div>
					<div class="nav-item">
						<a th:href="@{/login}">ログイン</a>
					</div>
					<div class="nav-item">
						<a th:href="@{/register}">新規登録</a>
					</div>
					<div class="nav-item">
						<a th:href="@{/admin/login}" class="nav-admin-link">管理者はこちら</a>
					</div>
				</div>
				<a sec:authorize="isAuthenticated()" th:href="@{/logout}" class="btn-logout">ログアウト</a>
			</nav>
		</div>
	</div>
	<div class="container">
		<div class="auth-card-header">
			<h1>ログイン</h1>
		</div>

		<div class="content">
			<div class="link-top-right">
				<a th:href="@{/register}">会員登録はこちら</a>
			</div>

			<p th:if="${successMessage}" th:text="${successMessage}" style="color: green; margin-bottom: 1em;"></p>

			<!-- ログインフォーム -->
			<form th:action="@{/login}" method="post">
				<input type="hidden" name="returnUrl" th:value="${returnUrl != null} ? ${returnUrl} : ''">
				<div class="form-group">
					<label>メールアドレス</label>
					<input type="email" name="email" required>
				</div>

				<div class="form-group">
					<label>パスワード</label>
					<input type="password" name="password" required>
				</div>

				<button type="submit" class="btn btn-login">
					ログイン
				</button>
			</form>

			<div class="link-bottom">
				パスワードがわからない場合は
				<a th:href="@{/password/forgot}">こちら</a>
			</div>
		</div>
	</div>

	<div class="copyright">©.</div>

</body>

</html>
