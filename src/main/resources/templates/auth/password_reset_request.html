<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>パスワード再設定</title>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="container">
    <div class="header">
        <h1>Reset Password</h1>
    </div>

    <div class="content">
        <p style="font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5;">
            ご登録済みのメールアドレスを入力してください。<br>
            パスワード再設定用のリンクをメールで送信します。
        </p>

        <form th:action="@{/password-reset-request}" method="post">
            <div class="form-group">
                <label>
                    メールアドレス<span class="required">（必須）</span>
                </label>
                <input type="email"
                       name="email"
                       placeholder="mail@example.com"
                       required>
            </div>

            <button type="submit" class="btn btn-change">
                送信する
            </button>
        </form>

        <div class="link-bottom">
            <a th:href="@{/login}">ログイン画面に戻る</a>
        </div>
    </div>
</div>

<div class="copyright">© My Shop</div>

</body>
</html>
