<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ページが見つかりません</title>
	<link rel="stylesheet" th:href="@{/css/variables.css}">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
	<script th:src="@{/js/theme.js}"></script>
	<link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
	<div th:replace="~{ui/fragments :: header}"></div>
	<main class="main-container error-container">
		<h1 class="error-status">404</h1>
		<p class="error-message" th:text="${message}">お探しのページが見つかりませんでした。</p>
		<div class="error-actions">
			<a th:href="@{/products}" class="btn-back">商品一覧へ戻る</a>
		</div>
	</main>
</body>
</html>
