<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ブラックリスト管理</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/blacklist.css}">
	<script th:src="@{/js/blacklist.js}" defer></script>
</head>

<body>
	<div th:replace="~{ui/fragments :: header}"></div>

	<main>
		<h1 class="page-title">
			<span class="material-symbols-outlined danger-icon">gavel</span>
			ブラックリスト統合管理
		</h1>

		<div class="filter-bar">
			<span class="filter-label">表示対象:</span>
			<a th:href="@{/admin/blacklist(type='all')}" class="filter-btn"
				th:classappend="${param.type == null || param.type[0] == 'all'} ? 'active'">ALL</a>
			<a th:href="@{/admin/blacklist(type='user')}" class="filter-btn"
				th:classappend="${param.type != null && param.type[0] == 'user'} ? 'active'">ユーザー</a>
			<a th:href="@{/admin/blacklist(type='product')}" class="filter-btn"
				th:classappend="${param.type != null && param.type[0] == 'product'} ? 'active'">商品</a>
		</div>

		<section class="admin-card">
			<table>
				<thead>
					<tr>
						<th>タイプ</th>
						<th>ID</th>
						<th>名前/タイトル</th>
						<th>現在の状態</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item : ${blacklistItems}">
						<td>
							<span th:if="${item.type == 'user'}" class="type-badge type-user">USER</span>
							<span th:if="${item.type == 'product'}" class="type-badge type-product">PRODUCT</span>
						</td>
						<td th:text="${item.id}">1</td>
						<td th:text="${item.name}">名前</td>
						<td>
							<span class="status-tag status-restricted">制限中</span>
						</td>
						<td>
							<div class="action-group">
								<form th:action="@{/admin/blacklist/restore}" method="post" style="display:inline;">
									<input type="hidden" name="id" th:value="${item.id}">
									<input type="hidden" name="type" th:value="${item.type}">
									<button type="submit" class="btn-action btn-restore" title="制限解除">
										<span class="material-symbols-outlined">settings_backup_restore</span>
									</button>
								</form>
								<button class="btn-action btn-hard-delete blacklist-open" th:data-user-id="${item.id}"
									th:data-user-name="${item.name}" title="永久削除">
									<span class="material-symbols-outlined">delete_forever</span>
								</button>
							</div>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(blacklistItems)}">
						<td colspan="5" style="text-align:center; padding: 40px; color: var(--text-sub);">
							対象のデータはありません。
						</td>
					</tr>
				</tbody>
			</table>
		</section>
	</main>

	<div class="modal-backdrop" id="blacklistModalBackdrop"></div>
	<div id="blacklistModal" class="modal-content">
		<div class="modal-header">
			<h3>永久削除の確認</h3>
			<span id="blacklistModalClose" class="material-symbols-outlined" style="cursor:pointer;">close</span>
		</div>
		<div class="modal-body">
			<p><strong id="blacklistUserName">対象名</strong> を完全に削除しますか？</p>
			<p style="color: var(--accent-red); font-size: 12px;">※この操作は取り消せません。データベースから抹消されます。</p>
		</div>
		<div class="modal-footer">
			<form th:action="@{/admin/blacklist/delete}" method="post">
				<input type="hidden" name="id" id="blacklistUserId">
				<button type="submit" class="btn-submit-post" style="background: var(--accent-red);">削除を確定する</button>
			</form>
		</div>
	</div>
</body>

</html>
