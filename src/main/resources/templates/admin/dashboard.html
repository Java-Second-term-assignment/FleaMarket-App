<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者ダッシュボード</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body>
    <div th:replace="~{ui/fragments :: header}"></div>

    <main>
        <h1 class="page-title">管理者ダッシュボード</h1>

        <!-- 統計表示 -->
        <section class="admin-stats">
            <div class="admin-stat-card">
                <span class="material-symbols-outlined admin-stat-icon">inventory_2</span>
                <div class="admin-stat-content">
                    <span class="admin-stat-value" th:text="${stats.totalActiveItems}">0</span>
                    <span class="admin-stat-label">公開中商品数</span>
                </div>
            </div>
            <div class="admin-stat-card">
                <span class="material-symbols-outlined admin-stat-icon">people</span>
                <div class="admin-stat-content">
                    <span class="admin-stat-value" th:text="${stats.totalUsers}">0</span>
                    <span class="admin-stat-label">登録ユーザー数</span>
                </div>
            </div>
        </section>

        <!-- グラフエリア -->
        <section class="admin-stats-charts">
            <div class="admin-chart-card">
                <h2 class="admin-chart-title">商品のステータス別件数</h2>
                <div class="admin-chart-wrap">
                    <canvas id="chartItemStatus"></canvas>
                </div>
            </div>
            <div class="admin-chart-card">
                <h2 class="admin-chart-title">商品登録数（直近<span th:text="${statsDays}">30</span>日）</h2>
                <div class="admin-chart-wrap">
                    <canvas id="chartItemCountsByDay"></canvas>
                </div>
            </div>
            <div class="admin-chart-card">
                <h2 class="admin-chart-title">ユーザー登録数（直近<span th:text="${statsDays}">30</span>日）</h2>
                <div class="admin-chart-wrap">
                    <canvas id="chartUserSignupsByDay"></canvas>
                </div>
            </div>
            <div class="admin-chart-card">
                <h2 class="admin-chart-title">閲覧数トップ10</h2>
                <div class="admin-chart-wrap">
                    <canvas id="chartTopViewed"></canvas>
                </div>
            </div>
        </section>

        <script type="application/json" id="itemStatusCountsJson" th:inline="text">[(${itemStatusCountsJson})]</script>
        <script type="application/json" id="itemCountsByDayJson" th:inline="text">[(${itemCountsByDayJson})]</script>
        <script type="application/json" id="userSignupCountsByDayJson" th:inline="text">[(${userSignupCountsByDayJson})]</script>
        <script type="application/json" id="topViewedItemsJson" th:inline="text">[(${topViewedItemsJson})]</script>
        <script th:inline="javascript">
            (function() {
                var chartDefaults = {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: { ticks: { color: '#cccccc' }, grid: { color: '#444' } },
                        y: { ticks: { color: '#cccccc' }, grid: { color: '#444' } }
                    },
                    plugins: {
                        legend: { labels: { color: '#cccccc' } }
                    }
                };
                function parseJson(id) {
                    var el = document.getElementById(id);
                    return el && el.textContent ? JSON.parse(el.textContent) : [];
                }
                var itemStatusCounts = parseJson('itemStatusCountsJson');
                if (itemStatusCounts.length > 0) {
                    var ctx = document.getElementById('chartItemStatus');
                    if (ctx) {
                        new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: itemStatusCounts.map(function(d) { return d.label; }),
                                datasets: [{
                                    data: itemStatusCounts.map(function(d) { return d.count; }),
                                    backgroundColor: ['#007bff', '#6c757d', '#dc3545', '#ffc107', '#28a745'].slice(0, itemStatusCounts.length),
                                    borderColor: '#1e2a3b',
                                    borderWidth: 2
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true,
                                plugins: { legend: { position: 'bottom', labels: { color: '#cccccc' } } }
                            }
                        });
                    }
                }
                var itemCountsByDay = parseJson('itemCountsByDayJson');
                if (itemCountsByDay.length > 0) {
                    var ctx = document.getElementById('chartItemCountsByDay');
                    if (ctx) {
                        new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: itemCountsByDay.map(function(d) { return d.date; }),
                                datasets: [{
                                    label: '商品数',
                                    data: itemCountsByDay.map(function(d) { return d.count; }),
                                    backgroundColor: 'rgba(0, 123, 255, 0.7)',
                                    borderColor: '#007bff',
                                    borderWidth: 1
                                }]
                            },
                            options: chartDefaults
                        });
                    }
                }
                var userSignupCountsByDay = parseJson('userSignupCountsByDayJson');
                if (userSignupCountsByDay.length > 0) {
                    var ctx = document.getElementById('chartUserSignupsByDay');
                    if (ctx) {
                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: userSignupCountsByDay.map(function(d) { return d.date; }),
                                datasets: [{
                                    label: '登録数',
                                    data: userSignupCountsByDay.map(function(d) { return d.count; }),
                                    borderColor: '#4caf50',
                                    backgroundColor: 'rgba(76, 175, 80, 0.2)',
                                    fill: true,
                                    tension: 0.2
                                }]
                            },
                            options: chartDefaults
                        });
                    }
                }
                var topViewedItems = parseJson('topViewedItemsJson');
                if (topViewedItems.length > 0) {
                    var ctx = document.getElementById('chartTopViewed');
                    if (ctx) {
                        var labels = topViewedItems.map(function(d) {
                            var name = d.itemName || '';
                            return name.length > 15 ? name.substring(0, 15) + '…' : name;
                        });
                        new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: '閲覧数',
                                    data: topViewedItems.map(function(d) { return d.viewCount; }),
                                    backgroundColor: 'rgba(255, 152, 0, 0.7)',
                                    borderColor: '#ff9800',
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                indexAxis: 'y',
                                responsive: true,
                                maintainAspectRatio: true,
                                scales: {
                                    x: { ticks: { color: '#cccccc' }, grid: { color: '#444' } },
                                    y: { ticks: { color: '#cccccc', font: { size: 11 } }, grid: { color: '#444' } }
                                },
                                plugins: { legend: { display: false } }
                            }
                        });
                    }
                }
            })();
        </script>
    </main>
</body>
</html>
