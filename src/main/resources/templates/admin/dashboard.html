<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者ダッシュボード</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div th:replace="~{ui/fragments :: header}"></div>

    <main>
        <h1 class="page-title">管理者ダッシュボード</h1>

        <!-- 統計表示 -->
        <section class="admin-stats">
            <div class="admin-stat-card">
                <span class="material-symbols-outlined admin-stat-icon">inventory_2</span>
                <div class="admin-stat-content">
                    <span class="admin-stat-value" th:text="${stats.totalActiveItems}">0</span>
                    <span class="admin-stat-label">公開中商品数</span>
                </div>
            </div>
            <div class="admin-stat-card">
                <span class="material-symbols-outlined admin-stat-icon">people</span>
                <div class="admin-stat-content">
                    <span class="admin-stat-value" th:text="${stats.totalUsers}">0</span>
                    <span class="admin-stat-label">登録ユーザー数</span>
                </div>
            </div>
        </section>

        <!-- 管理メニュー（ヘッダーからも遷移可能） -->
        <section class="admin-dashboard-links">
            <h2 class="admin-section-title">管理メニュー</h2>
            <div class="admin-link-cards">
                <a th:href="@{/admin/users}" class="admin-link-card">
                    <span class="material-symbols-outlined">person</span>
                    <span>ユーザー管理</span>
                </a>
                <a th:href="@{/admin/products}" class="admin-link-card">
                    <span class="material-symbols-outlined">inventory</span>
                    <span>商品管理</span>
                </a>
                <a th:href="@{/admin/blacklist}" class="admin-link-card">
                    <span class="material-symbols-outlined">block</span>
                    <span>ブラックリスト管理</span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
