<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ユーザー設定</title>
	<link rel="stylesheet" th:href="@{/css/variables.css}">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
	<script th:src="@{/js/theme.js}"></script>
	<link rel="stylesheet" th:href="@{/css/user.css}">
</head>

<body>
	<div th:replace="~{ui/fragments :: header}"></div>

	<main class="main-container">
		<div class="profile-setting-container">
			<h1 class="page-title">プロフィール設定</h1>

			<div class="profile-card">
				<div class="profile-card-main">
					<div class="profile-icon-wrap profile-icon-wrap-edit">
						<div class="profile-image profile-image-edit" id="profileIconDisplay"
							th:data-imgsrc="${user.iconUrl}">
							<span class="material-symbols-outlined profile-icon-placeholder"
								th:if="${user.iconUrl == null || user.iconUrl == ''}">person</span>
							<img th:if="${user.iconUrl != null && user.iconUrl != ''}" th:src="${user.iconUrl}"
								alt="icon">
						</div>
						<button class="profile-icon-edit" id="openProfileEditModalBtn">編集</button>
					</div>

					<div class="profile-info profile-info-edit">
						<div class="profile-info-flex">
							<div>
								<div class="profile-info-title" id="profileDisplayTitle" th:text="${user.displayTitle}">
									表示名</div>
								<div class="profile-info-name" id="profileDisplayName" th:text="${user.username}">ユーザー名
								</div>
								<div class="profile-info-caption" id="profileDisplayCaption"
									th:text="${user.caption != null && user.caption != '' ? user.caption : 'プロフィールはまだ未記入です。'}">
									プロフィールはまだ未記入です。
								</div>
							</div>
							<div class="profile-badge">
								<img th:src="@{/img/Bronze1.png}" alt="badge">
							</div>
						</div>
					</div>
				</div>

				<div class="modal-backdrop" id="modalProfileBackdrop"></div>
				<div class="modal-profile-edit" id="modalProfileEdit">
					<button class="modal-close-x" id="modalProfileCloseBtn">&times;</button>
					<h2>プロフィール編集</h2>

					<form id="profileEditForm">
						<label>アイコン画像</label><br>
						<img id="modalProfileIconPreview" class="modal-profile-icon-preview" style="display:none;">
						<span id="modalProfileIconNoImage" class="modal-profile-icon-placeholder"><span class="material-symbols-outlined">person</span></span>

						<label class="modal-profile-uploadlabel">画像アップロード</label>
						<input type="file" id="modalProfileIconFile" accept="image/*">

						<label>表示名</label>
						<input type="text" id="modalProfileEditTitle" th:value="${user.displayTitle}" maxlength="18">

						<label>メールアドレス</label>
						<input type="text" id="modalProfileEditName" th:value="${user.username}" maxlength="12" readonly>

						<label>自己紹介</label>
						<textarea id="modalProfileEditCaption" maxlength="80">[[${user.caption}]]</textarea>

						<div class="modal-btn-row">
							<button type="button" id="modalProfileCancelBtn" class="modal-cancel-btn">キャンセル</button>
							<button type="submit" class="modal-save-btn">保存</button>
						</div>
					</form>
				</div>

				<div class="tab-bar">
					<button class="tab active" data-tab="favorite">お気に入り</button>
					<button class="tab" data-tab="history">商品</button>
					<button class="tab" data-tab="settings">設定</button>
				</div>

				<div class="profile-tab-content" id="tab-favorite" style="display:block;">
					<div class="product-grid">

						<th:block th:if="${favorites != null and !favorites.empty}">
							<a th:each="item : ${favorites}" th:href="@{/products/{id}(id=${item.id})}"
								class="product-card-link">
								<div class="item-card">
									<img th:src="${item.imageUrl}" class="item-img" alt="商品画像">
									<div class="item-card-title" th:text="${item.title}">商品名</div>
									<div class="item-card-price" th:text="${item.price + '円'}">0円</div>
								</div>
							</a>
						</th:block>

						<p th:if="${favorites == null or favorites.empty}" class="empty-message">
							お気に入りはまだありません。
						</p>
					</div>
				</div>

				<div class="profile-tab-content" id="tab-history" style="display:none;">
					<div class="product-grid">
						<th:block th:if="${userProducts != null and !userProducts.empty}">
							<a th:each="item : ${userProducts}" th:href="@{/products/{id}(id=${item.id})}"
								class="product-card-link">
								<div class="item-card">
									<img th:src="${item.imageUrl}" class="item-img" alt="商品画像">
									<div class="item-card-title" th:text="${item.name}">商品名</div>
								</div>
							</a>
						</th:block>
						<p th:if="${userProducts == null or userProducts.empty}" class="empty-message">
							投稿した商品はありません。
						</p>
					</div>
				</div>

				<!-- 設定 -->
				<div class="profile-tab-content tab-settings" id="tab-settings" style="display: none;">

					<div class="settings-card">

						<div th:if="${message}" class="settings-flash-message" style="color:#4ade80;margin-bottom:12px;" th:text="${message}">メッセージ</div>
						<div th:if="${errorMessage}" class="settings-flash-error" style="color:#f87171;margin-bottom:12px;" th:text="${errorMessage}">エラーメッセージ</div>

						<!-- パスワード変更 -->
						<div class="settings-title">
							パスワード
						</div>
						<div class="settings-card-section" style="margin-bottom:18px;">
							<a th:href="@{/password/change}" class="profile-icon-edit" style="display:inline-block;padding:6px 16px;text-decoration:none;color:inherit;">パスワードを変更する</a>
						</div>

						<!-- 通知設定 -->
						<form th:action="@{/user/settings/notification}" method="post">
							<th:block th:replace="~{ui/fragments :: csrf_token}"></th:block>
							<div class="settings-title">
								通知設定
							</div>
							<div class="settings-checkbox-wrap">
								<label class="settings-checkbox-label">
									<input type="checkbox" class="settings-checkbox-input" name="notificationEnabled"
										value="true" th:checked="${userSettings.notificationEnabled}">
									通知を受け取る
								</label>
							</div>
							<div class="settings-save-btn-wrap" style="margin-top:16px;">
								<button type="submit" class="settings-save-btn">全体の設定を保存</button>
							</div>
						</form>

						<!-- 支払い状況 -->
						<div class="settings-title" style="margin-top:32px;">
							現在の支払い状況
						</div>

						<div class="settings-card-section" style="margin-bottom:18px;">
							<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
								<span style="color:#ffd743;margin-right:14px;">登録クレジットカード:</span>

								<span style="font-weight:bold;color:#fff;"
									th:text="${creditCard.maskedNumber ?: '未登録'}">
									**** **** **** 1234
								</span>

								<button class="profile-icon-edit" style="padding:2px 12px;font-size:12px;margin:0 2px;">
									変更
								</button>

								<button class="profile-icon-edit"
									style="padding:2px 12px;background:#e55d5d;color:#fff;font-size:12px;margin:0 2px;">
									削除
								</button>
							</div>

							<div>
								<span style="color:#ffd743;margin-right:14px;">有効期限:</span>
								<span style="color:#fff;"
									th:text="${creditCard.expireMonth + '/' + creditCard.expireYear}">
									04/27
								</span>
							</div>
						</div>

						<!-- 配送先情報 -->
						<div class="settings-title">
							配送先情報
						</div>

						<div class="settings-card-section">
							<form id="address-edit-form" th:action="@{/user/address/update}" method="post"
								style="display:flex;flex-direction:column;gap:10px;">
								<th:block th:replace="~{ui/fragments :: csrf_token}"></th:block>

								<div>
									<label style="color:#ffd743;">お名前</label><br>
									<input type="text" name="recipientName" th:value="${address.recipientName}"
										style="padding:6px 12px;border-radius:5px;border:1px solid #bdbdbd;width:240px;">
								</div>

								<div>
									<label style="color:#ffd743;">郵便番号</label><br>
									<input type="text" name="postalCode" th:value="${address.postalCode}"
										style="padding:6px 12px;border-radius:5px;border:1px solid #bdbdbd;width:120px;">
								</div>

								<div>
									<label style="color:#ffd743;">住所</label><br>
									<input type="text" name="address" th:value="${address.address}"
										style="padding:6px 12px;border-radius:5px;border:1px solid #bdbdbd;width:340px;">
								</div>

								<div>
									<label style="color:#ffd743;">電話番号</label><br>
									<input type="text" name="phone" th:value="${address.phone}"
										style="padding:6px 12px;border-radius:5px;border:1px solid #bdbdbd;width:180px;">
								</div>

								<button class="profile-icon-edit" type="submit"
									style="width:max-content;padding:4px 20px;font-size:13px;margin-top:10px;">
									配送先情報を保存
								</button>
							</form>
						</div>

					</div>
				</div>

			</div>
		</div>
	</main>

	<script th:src="@{/js/user_settings.js}"></script>
</body>

</html>
