<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>掲示板</title>
	<link rel="stylesheet" th:href="@{/css/variables.css}">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
	<script th:src="@{/js/theme.js}"></script>
	<link rel="stylesheet" th:href="@{/css/board-detail.css}">
</head>

<body>
	<div th:replace="~{ui/fragments :: header}"></div>

	<main>
		<h1 class="page-title">掲示板</h1>

		<section class="post-form-container" sec:authorize="isAuthenticated()">
			<form th:action="@{/board/{boardId}/posts(boardId=${boardId})}" method="post">
				<th:block th:replace="~{ui/fragments :: csrf_token}"></th:block>
				<div class="form-group">
					<label for="content">投稿</label>
					<textarea id="content" name="content" required maxlength="1000" placeholder="投稿内容を入力..."></textarea>
					<div class="char-count"><span id="contentCharCount">0</span>/1000</div>
				</div>
				<button type="submit" class="btn-submit">投稿する</button>
			</form>
		</section>

		<p class="login-to-post" sec:authorize="isAnonymous()">
			<a th:href="@{/login(returnUrl=${'/board/' + boardId})}">ログイン</a>すると投稿できます
		</p>

		<section class="posts-list">
			<div th:if="${#lists.isEmpty(posts)}" class="empty-message">まだ投稿がありません</div>
			<div th:each="post : ${posts}" class="post-item">
				<div class="post-content" th:text="${post.content}">投稿内容</div>
				<div class="post-footer">
					<span class="post-author" th:text="${post.authorDisplayName != null ? post.authorDisplayName : 'ユーザー'}">著者</span>
					<span class="post-date" th:text="${post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy/MM/dd HH:mm') : ''}">日時</span>
				</div>
			</div>
		</section>
	</main>

	<script th:src="@{/js/board-detail.js}"></script>
</body>

</html>
