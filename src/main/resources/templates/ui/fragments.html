<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="common_head(title, links)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${title}">My Shop</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<th:block th:replace="${links}" />
</head>

<body>
	<div th:fragment="header" class="header">
		<div class="header-inner">

			<!-- ロゴ -->
			<div class="logo">
				<a th:href="@{/}" style="color:white; text-decoration:none;">LOGO</a>
			</div>

			<nav class="nav">
				<div class="nav-links">

					<!-- 一般画面のみ表示（管理者画面では非表示） -->
					<div class="nav-item" th:if="${!isAdminContext}">
						<a th:href="@{/products}">商品一覧</a>
					</div>
					<div class="nav-item" th:if="${!isAdminContext}">
						<a th:href="@{/board}">掲示板一覧</a>
					</div>

					<!-- 未ログイン時（ログインのみ表示、新規登録は非表示） -->
					<div class="nav-item" sec:authorize="isAnonymous()">
						<a th:href="@{/login}">
							ログイン
						</a>
					</div>
					<div class="nav-item" sec:authorize="isAnonymous()">
						<a th:href="@{/admin/login}" class="nav-admin-link">
							管理者はこちら
						</a>
					</div>

					<!-- ログイン時（管理者画面では非表示） -->
					<div class="nav-item" sec:authorize="isAuthenticated()" th:if="${!isAdminContext}">
						<a th:href="@{/user/settings}">
							ユーザー設定
						</a>
					</div>
					<!-- 管理者画面用ナビ -->
					<div class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a th:href="@{/admin/dashboard}">
							統計画面
						</a>
					</div>
					<div class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a th:href="@{/admin/users}">
							ユーザー管理
						</a>
					</div>
					<div class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a th:href="@{/admin/products}">
							商品管理
						</a>
					</div>
				</div>

				<!-- ログイン時のみ（管理者画面では非表示） -->
				<button sec:authorize="isAuthenticated()" th:if="${!isAdminContext}" class="btn-post" th:onclick="|location.href='@{/product/add}'|">
					出品する
				</button>

				<a sec:authorize="isAuthenticated()" th:href="@{/logout}" class="btn-logout">
					ログアウト
				</a>

			</nav>
		</div>
	</div>
</body>

</html>
