<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="common_head(title, links)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${title}">My Shop</title>
	<link rel="stylesheet" th:href="@{/css/variables.css}">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/theme.css}">
	<script th:src="@{/js/theme.js}"></script>
	<th:block th:replace="${links}" />
</head>

<body>
	<th:block th:fragment="theme_toggle_button">
		<button type="button" class="btn-theme-toggle" onclick="toggleTheme();" title="テーマ切替" aria-label="テーマ切替">
			<span class="theme-icon theme-icon-dark" aria-hidden="true">dark_mode</span>
			<span class="theme-icon theme-icon-light" aria-hidden="true">light_mode</span>
		</button>
	</th:block>
	<!-- CSRF トークン（POST フォーム内に th:replace="~{ui/fragments :: csrf_token}" で挿入） -->
	<th:block th:fragment="csrf_token">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
	</th:block>
	<!-- ログアウトフォーム（POST必須・CSRF保護のため） -->
	<th:block th:fragment="logout_form">
		<form th:action="@{/logout}" method="post" style="display:inline;">
			<th:block th:replace="~{ui/fragments :: csrf_token}"></th:block>
			<button type="submit" class="btn-logout">ログアウト</button>
		</form>
	</th:block>
	<div th:fragment="header" class="header">
		<div class="header-inner">

			<!-- ロゴ -->
			<div class="logo">
				<a th:href="@{/}" style="color:white; text-decoration:none;">LOGO</a>
			</div>

			<nav class="nav">
				<div class="nav-links">

					<!-- テーマ切替（商品一覧の左・区切り線で区切る） -->
					<div class="nav-item nav-item-theme">
						<th:block th:replace="~{ui/fragments :: theme_toggle_button}"></th:block>
					</div>
					<!-- 一般画面のみ表示（管理者画面では非表示） -->
					<div class="nav-item" th:if="${isAdminContext != true}">
						<a th:href="@{/products}">商品一覧</a>
					</div>
					<div class="nav-item" th:if="${isAdminContext != true}">
						<a th:href="@{/board}">掲示板一覧</a>
					</div>

					<!-- 未ログイン時（ログインのみ表示、新規登録は非表示） -->
					<div class="nav-item" sec:authorize="isAnonymous()">
						<a th:href="@{/login}">
							ログイン
						</a>
					</div>
					<div class="nav-item" sec:authorize="isAnonymous()">
						<a th:href="@{/admin/login}" class="nav-admin-link">
							管理者はこちら
						</a>
					</div>

					<!-- ログイン時（管理者画面では非表示） -->
					<div class="nav-item" sec:authorize="isAuthenticated()" th:if="${isAdminContext != true}">
						<a th:href="@{/cart}">
							カート
						</a>
					</div>
					<div class="nav-item" sec:authorize="isAuthenticated()" th:if="${isAdminContext != true}">
						<a th:href="@{/user/orders}">
							注文一覧
						</a>
					</div>
					<div class="nav-item" sec:authorize="isAuthenticated()" th:if="${isAdminContext != true}">
						<a th:href="@{/user/settings}">
							ユーザー設定
						</a>
					</div>
					<!-- 管理者画面用ナビ -->
					<div class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a th:href="@{/admin/dashboard}">
							統計画面
						</a>
					</div>
					<div class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a th:href="@{/admin/users}">
							ユーザー管理
						</a>
					</div>
					<div class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a th:href="@{/admin/products}">
							商品管理
						</a>
					</div>
				</div>

				<!-- ログイン時のみ（管理者画面では非表示） -->
				<button sec:authorize="isAuthenticated()" th:if="${isAdminContext != true}" class="btn-post" th:onclick="|location.href='@{/product/add}'|">
					出品する
				</button>

				<th:block sec:authorize="isAuthenticated()" th:replace="~{ui/fragments :: logout_form}"></th:block>

			</nav>
		</div>
	</div>
</body>

</html>
