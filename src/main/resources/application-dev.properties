# 開発用プロファイル（PostgreSQL、ポート8082）
server.port=8082

# データソース（dev でも PostgreSQL を使用。H2 は pom に含まれていない）
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/flea_market}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# 開発用シード（ユーザー・商品）を dev_migration から投入
spring.flyway.locations=classpath:db/migration,classpath:db/dev_migration

# 開発時は画像をローカル保存（AWS S3 不要）
app.image.storage=local

# デモ商品画像（picture/）の配信元。V72 で投入した item_images の demo/ キー用
app.demo-images.dir=./picture
