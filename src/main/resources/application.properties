spring.application.name=flea-market-app

# 開発時は dev プロファイルをデフォルトに。本番では SPRING_PROFILES_ACTIVE=pg で上書き。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========
# AWS S3設定
# =========
# 本番: 環境変数 AWS_S3_BUCKET_NAME で実バケット名を指定すること
aws.s3.region=${AWS_S3_REGION:ap-northeast-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:your-bucket-name}
aws.s3.profile-image.prefix=profiles
aws.s3.profile-image.max-size=5242880
aws.s3.profile-image.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
aws.s3.item-image.prefix=items
aws.s3.item-image.max-size=5242880
aws.s3.item-image.max-count=10
aws.s3.item-image.min-count=1

# AWSの設定
# app.aws.region=ap-northeast-1
# app.aws.s3-bucket=your-bucket


# stripeの設定
#app.stripe.api-key=sk_test_xxx
#app.stripe.webhook-secret=whsec_xxx
#app.stripe.currency=JPY


# データソース（デフォルト: H2。PostgreSQL は pg プロファイルで）
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:fleamarket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ファイルアップロード（商品画像は最大5MB想定。デフォルト1MBだと413になる）
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB
# Tomcat 10.1.42+ の multipart パート数制限（デフォルト10）。フォーム項目+画像で超えるため引き上げ
server.tomcat.max-part-count=50

# Flyway + JPA（スキーマはFlywayで管理）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# =========
# メール（通知プッシュ用 SMTP）
# =========
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@example.com}
# =========
# JWT（アクセストークン）
# =========
# 本番: 環境変数 APP_JWT_SECRET で 256bit 以上の秘密鍵を指定すること
app.jwt.secret=${APP_JWT_SECRET:flea-market-app-jwt-secret-key-min-32-bytes-for-hs256}
app.jwt.access-token-expiration=15m

# パスワード再設定（メールのリンク用ベースURL・トークン有効期限）
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.password-reset.token-expiration-minutes=60

# CORS（本番: 環境変数 APP_CORS_ALLOWED_ORIGINS で許可オリジンを指定。カンマ区切り）
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# 画像ストレージ（開発: local でローカルファイル保存、本番: s3）
app.image.storage=${APP_IMAGE_STORAGE:s3}
app.upload.dir=${APP_UPLOAD_DIR:./uploads}