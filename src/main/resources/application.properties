spring.application.name=flea-market-app

# 開発時は dev プロファイルをデフォルトに。本番では SPRING_PROFILES_ACTIVE=pg で上書き。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========
# AWS S3設定
# =========
aws.s3.region=ap-northeast-1
aws.s3.bucket.name=your-bucket-name
aws.s3.profile-image.prefix=profiles
aws.s3.profile-image.max-size=5242880
aws.s3.profile-image.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
aws.s3.item-image.prefix=items
aws.s3.item-image.max-size=5242880
aws.s3.item-image.max-count=10
aws.s3.item-image.min-count=1

# データソース（PostgreSQL）
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/flea_market}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Flyway + JPA（スキーマはFlywayで管理）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# =========
# メール（通知プッシュ用 SMTP）
# =========
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@example.com}