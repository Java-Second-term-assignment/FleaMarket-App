#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:/schema.sql
#spring.sql.init.data-locations=classpath:/data.sql

# =========
# AWS S3設定
# =========
aws.s3.region=ap-northeast-1
aws.s3.bucket.name=your-bucket-name
aws.s3.profile-image.prefix=profiles
aws.s3.profile-image.max-size=5242880
aws.s3.profile-image.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
aws.s3.item-image.prefix=items
aws.s3.item-image.max-size=5242880
aws.s3.item-image.max-count=10
aws.s3.item-image.min-count=1

# # PostgreSQL 接続設定
