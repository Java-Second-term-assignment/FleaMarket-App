spring.application.name=flea-market-app

# 開発時は dev プロファイル（H2）をデフォルトに。本番では SPRING_PROFILES_ACTIVE で上書き。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========
# AWS S3設定
# =========
aws.s3.region=ap-northeast-1
aws.s3.bucket.name=your-bucket-name
aws.s3.profile-image.prefix=profiles
aws.s3.profile-image.max-size=5242880
aws.s3.profile-image.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
aws.s3.item-image.prefix=items
aws.s3.item-image.max-size=5242880
aws.s3.item-image.max-count=10
aws.s3.item-image.min-count=1

# AWSの設定
# app.aws.region=ap-northeast-1
# app.aws.s3-bucket=your-bucket


# stripeの設定
#app.stripe.api-key=sk_test_xxx
#app.stripe.webhook-secret=whsec_xxx
#app.stripe.currency=JPY


# データソース（デフォルト: H2。PostgreSQL は pg プロファイルで）
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:fleamarket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# DB スキーマ（現在: Hibernate ddl-auto。将来 Flyway 導入時は下記をコメントアウトし、Flyway 用を有効化）
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=never
# --- Flyway 導入時（コメントを外して上記3行をコメントアウト）---
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
# spring.jpa.hibernate.ddl-auto=none
# spring.sql.init.mode=never

# =========
# メール（通知プッシュ用 SMTP）
# =========
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_FROM:noreply@example.com}